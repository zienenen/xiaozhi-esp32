<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>小智自研平台一期后台交互原型</title>
  <style>
    :root {
      --bg: #f4f8fb;
      --panel: #ffffff;
      --line: #d9e4ef;
      --line-strong: #c8d7e8;
      --text: #0f172a;
      --muted: #667085;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #0f9f6e;
      --warning: #b45309;
      --danger: #e11d48;
      --blue-soft: #eaf2ff;
      --green-soft: #e7f8f2;
      --rose-soft: #fff0f4;
      --orange-soft: #fff6e5;
      --surface: #fbfdff;
      --shadow: 0 14px 32px rgba(15, 23, 42, 0.07);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }

    button, input { font: inherit; }
    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 232px minmax(0, 1fr);
      transition: grid-template-columns .2s ease;
    }
    .app.collapsed { grid-template-columns: 72px minmax(0, 1fr); }

    .side-nav {
      position: sticky;
      top: 0;
      height: 100vh;
      background: var(--panel);
      border-right: 1px solid var(--line);
      padding: 16px 12px;
      overflow: hidden;
      z-index: 2;
    }
    .brand {
      height: 54px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 8px 14px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }
    .logo {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: var(--blue-soft);
      border: 1px solid #cfe0ff;
      color: var(--primary);
      display: grid;
      place-items: center;
      font-weight: 900;
      flex: 0 0 auto;
    }
    .brand-title { font-weight: 850; }
    .brand-subtitle { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .nav-section {
      color: var(--muted);
      font-size: 12px;
      padding: 12px 10px 8px;
      white-space: nowrap;
    }
    .nav-item {
      width: 100%;
      height: 38px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #344054;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 10px;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
    }
    .nav-item:hover { background: #f7fbff; }
    .nav-item.active { background: var(--blue-soft); color: var(--primary-dark); }
    .nav-ico { width: 20px; text-align: center; flex: 0 0 auto; }
    .app.collapsed .nav-text,
    .app.collapsed .brand-text,
    .app.collapsed .nav-section { display: none; }
    .app.collapsed .side-nav { padding-left: 8px; padding-right: 8px; }
    .app.collapsed .brand { justify-content: center; padding-left: 0; padding-right: 0; }
    .app.collapsed .nav-item { justify-content: center; padding: 0; }

    .main {
      min-width: 0;
      padding: 20px 24px 32px;
    }
    .topbar {
      min-height: 74px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 20px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
    }
    .title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 280px;
    }
    .collapse-btn {
      width: 34px;
      height: 34px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: #fff;
      color: #344054;
      font-weight: 900;
      cursor: pointer;
    }
    .app-icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: var(--blue-soft);
      border: 1px solid #cfe0ff;
      color: var(--primary);
      display: grid;
      place-items: center;
      font-weight: 900;
    }
    h1 { margin: 0; font-size: 20px; line-height: 1.2; }
    .subtitle { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .search {
      width: 300px;
      height: 34px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      padding: 0 12px;
      color: var(--muted);
      background: #fff;
    }
    .mode-switch {
      height: 34px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: #fff;
      padding: 3px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .mode-btn {
      height: 26px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      padding: 0 11px;
      color: #475467;
      font-weight: 800;
      cursor: pointer;
    }
    .mode-btn.active { background: var(--blue-soft); color: var(--primary-dark); }
    .btn {
      height: 34px;
      border-radius: 6px;
      border: 1px solid var(--line-strong);
      padding: 0 14px;
      background: #fff;
      color: #344054;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
      font-weight: 700;
    }
    .btn:hover { border-color: #9eb7d4; }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }

    .workspace {
      display: grid;
      grid-template-columns: minmax(520px, 1fr) 440px;
      gap: 20px;
      margin-top: 20px;
      align-items: start;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 20px;
      align-items: start;
    }
    .agent-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      min-height: 226px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);
      cursor: pointer;
    }
    .agent-card.active { border-color: #9fc0fa; box-shadow: var(--shadow); }
    .card-head {
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 20px;
      border: 1px solid;
      flex: 0 0 auto;
    }
    .rose { color: var(--danger); background: var(--rose-soft); border-color: #ffc7d6; }
    .green { color: #047857; background: var(--green-soft); border-color: #a7ead5; }
    .blue { color: var(--primary); background: var(--blue-soft); border-color: #cfe0ff; }
    .agent-title { flex: 1; min-width: 0; }
    .name-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .name { font-size: 17px; font-weight: 850; }
    .status {
      border-radius: 999px;
      padding: 2px 7px;
      font-size: 12px;
      border: 1px solid;
      line-height: 18px;
      white-space: nowrap;
    }
    .status.online { color: var(--success); background: #e9fbf3; border-color: #b7eed8; }
    .status.warn { color: var(--warning); background: var(--orange-soft); border-color: #ffd48a; }
    .status.sync { color: var(--primary-dark); background: var(--blue-soft); border-color: #bfd5ff; }
    .more { color: #101828; font-weight: 900; letter-spacing: 2px; }
    .meta {
      margin: 0 16px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      overflow: hidden;
    }
    .meta-item {
      padding: 12px;
      min-height: 68px;
      border-right: 1px solid var(--line);
    }
    .meta-item:last-child { border-right: 0; }
    .label { color: var(--muted); font-size: 12px; display: block; margin-bottom: 7px; }
    .value { font-weight: 700; line-height: 1.35; }
    .card-actions {
      border-top: 1px solid var(--line);
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      background: var(--surface);
    }
    .card-actions .btn { width: 100%; padding: 0 8px; }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: var(--shadow);
      overflow: hidden;
      position: sticky;
      top: 16px;
    }
    .panel-head {
      padding: 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start;
    }
    .panel-title { font-size: 18px; font-weight: 850; margin-bottom: 6px; }
    .panel-copy { color: var(--muted); line-height: 1.55; }
    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-bottom: 1px solid var(--line);
    }
    .tab {
      padding: 12px 8px;
      text-align: center;
      font-weight: 800;
      color: #475467;
      border: 0;
      border-right: 1px solid var(--line);
      background: var(--surface);
      cursor: pointer;
    }
    .tab:last-child { border-right: 0; }
    .tab.active { color: var(--primary); background: #fff; box-shadow: inset 0 -2px 0 var(--primary); }
    .panel-body { padding: 16px; }
    .field {
      padding: 12px 0;
      border-bottom: 1px solid #edf2f7;
    }
    .field:first-child { padding-top: 0; }
    .field:last-child { border-bottom: 0; }
    .field-title { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
    .field-main { line-height: 1.55; font-weight: 650; }
    .prompt-box {
      border: 1px dashed #bfd5ff;
      background: #f8fbff;
      border-radius: 8px;
      padding: 12px;
      line-height: 1.65;
      color: #1f2937;
    }
    .timeline { display: grid; gap: 10px; }
    .event {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      background: var(--surface);
    }
    .event-top { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
    .event-text { line-height: 1.55; }
    .stamp-page {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 18px;
      margin-top: 20px;
      align-items: start;
    }
    .cute-map {
      min-height: 680px;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background:
        radial-gradient(circle at 18% 18%, rgba(255, 232, 180, .8), transparent 23%),
        radial-gradient(circle at 80% 16%, rgba(172, 221, 255, .72), transparent 24%),
        radial-gradient(circle at 78% 82%, rgba(188, 244, 210, .82), transparent 22%),
        linear-gradient(135deg, #fff6d9, #eaf7ff 48%, #fff0f6);
      box-shadow: 0 24px 60px rgba(37, 99, 235, .12);
      isolation: isolate;
    }
    .cute-map::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.34) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.34) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(circle at center, rgba(0,0,0,.85), transparent 78%);
      pointer-events: none;
    }
    .map-cloud {
      position: absolute;
      border-radius: 999px;
      background: rgba(255,255,255,.62);
      box-shadow: 0 12px 28px rgba(148, 163, 184, .12);
    }
    .cloud-a { width: 170px; height: 58px; left: 15%; top: 18%; }
    .cloud-b { width: 210px; height: 66px; right: 12%; top: 30%; }
    .map-river {
      position: absolute;
      right: -4%;
      top: 12%;
      width: 34%;
      height: 76%;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(108, 205, 245, .55), rgba(118, 230, 208, .36));
      transform: rotate(8deg);
      border: 2px solid rgba(255,255,255,.7);
    }
    .map-title {
      position: absolute;
      left: 24px;
      top: 22px;
      z-index: 3;
      padding: 16px 18px;
      border-radius: 16px;
      background: rgba(255, 255, 255, .72);
      border: 1px solid rgba(255,255,255,.9);
      backdrop-filter: blur(10px);
    }
    .map-title h2 { margin: 0; font-size: 26px; }
    .map-title .subtitle { font-size: 13px; }
    .map-tools {
      position: absolute;
      right: 18px;
      top: 18px;
      z-index: 4;
      display: flex;
      gap: 8px;
    }
    .map-chip {
      height: 34px;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 999px;
      background: rgba(255,255,255,.74);
      backdrop-filter: blur(10px);
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      color: #344054;
    }
    .lane {
      position: absolute;
      left: 11%;
      right: 13%;
      top: 50%;
      height: 76px;
      border-radius: 999px;
      background: linear-gradient(90deg, #f9d89c, #fff1c7, #f8c97c);
      border: 3px solid rgba(255,255,255,.75);
      transform: rotate(-8deg);
      opacity: .92;
      box-shadow: inset 0 5px 18px rgba(180, 83, 9, .12);
    }
    .lane::after {
      content: "";
      position: absolute;
      left: 8%;
      right: 8%;
      top: 27px;
      border-top: 4px dotted rgba(180, 83, 9, .42);
    }
    .mini-house {
      position: absolute;
      width: 86px;
      height: 62px;
      border-radius: 12px 12px 8px 8px;
      background: rgba(255, 255, 255, .76);
      border: 2px solid rgba(255,255,255,.92);
      box-shadow: 0 12px 24px rgba(15,23,42,.08);
    }
    .mini-house::before {
      content: "";
      position: absolute;
      left: 12px;
      right: 12px;
      top: -22px;
      height: 30px;
      border-radius: 16px 16px 4px 4px;
      background: #d96f4f;
    }
    .player-marker {
      position: absolute;
      left: 49%;
      top: 49%;
      z-index: 5;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--primary);
      border: 4px solid #fff;
      box-shadow: 0 0 0 12px rgba(37, 99, 235, .12), 0 0 0 26px rgba(37, 99, 235, .07);
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 10px rgba(37,99,235,.14), 0 0 0 24px rgba(37,99,235,.06); }
      50% { transform: scale(1.08); box-shadow: 0 0 0 18px rgba(37,99,235,.08), 0 0 0 36px rgba(37,99,235,.04); }
    }
    .stamp-pin {
      position: absolute;
      z-index: 4;
      width: 82px;
      min-height: 96px;
      border: 1px solid var(--line);
      border-radius: 999px 999px 18px 18px;
      background: rgba(255, 255, 255, .86);
      box-shadow: 0 16px 32px rgba(15, 23, 42, .12);
      padding: 10px 8px;
      cursor: pointer;
      transform: translate(-50%, -50%);
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    }
    .stamp-pin:hover,
    .stamp-pin.active { transform: translate(-50%, -56%); border-color: #9fc0fa; box-shadow: 0 22px 42px rgba(37, 99, 235, .18); }
    .stamp-pin.done { background: rgba(241,255,248,.94); border-color: #a7ead5; }
    .pin-badge {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 900;
      margin: 0 auto 7px;
      box-shadow: inset 0 -3px 0 rgba(15,23,42,.07);
    }
    .pin-name { font-weight: 850; margin-bottom: 3px; font-size: 12px; text-align: center; }
    .pin-state { color: var(--muted); font-size: 11px; line-height: 1.35; text-align: center; }
    .spot-card {
      position: absolute;
      left: 24px;
      bottom: 24px;
      z-index: 6;
      width: min(420px, calc(100% - 48px));
      border: 1px solid rgba(255,255,255,.88);
      border-radius: 16px;
      background: rgba(255,255,255,.78);
      backdrop-filter: blur(14px);
      box-shadow: 0 18px 46px rgba(15,23,42,.14);
      padding: 16px;
    }
    .spot-card-head {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }
    .spot-icon {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      font-size: 22px;
      font-weight: 900;
    }
    .scan-line {
      position: absolute;
      inset: 120px 52px 96px;
      border-radius: 50%;
      border: 1px solid rgba(37, 99, 235, .18);
      animation: scan 3s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes scan {
      0%, 100% { transform: scale(.96); opacity: .2; }
      50% { transform: scale(1.03); opacity: .7; }
    }
    .stamp-side {
      background: linear-gradient(180deg, #ffffff, #fbfdff);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
      position: sticky;
      top: 16px;
    }
    .stamp-album {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 16px;
    }
    .stamp {
      aspect-ratio: 1;
      border-radius: 14px;
      border: 1px dashed var(--line-strong);
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
      background: var(--surface);
      font-size: 12px;
      padding: 8px;
    }
    .stamp.done {
      color: var(--success);
      border-style: solid;
      background: #f1fff8;
      font-weight: 850;
    }
    .quest-list {
      display: grid;
      gap: 10px;
      padding: 0 16px 16px;
    }
    .quest {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      background: var(--surface);
    }
    .quest strong { display: block; margin-bottom: 4px; }
    .module-page {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 18px;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);
    }
    .module-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-top: 16px;
    }
    .module-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      background: var(--surface);
    }
    .module-title { font-size: 16px; font-weight: 850; margin: 0; }
    .module-desc { color: var(--muted); margin-top: 8px; line-height: 1.6; }
    .footer-note {
      margin-top: 18px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: #fff;
      line-height: 1.6;
    }
    .chat-page {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 18px;
      margin-top: 20px;
      align-items: stretch;
    }
    .role-rail,
    .chat-shell {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);
      overflow: hidden;
    }
    .rail-head,
    .chat-head {
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }
    .role-option {
      width: calc(100% - 24px);
      margin: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fff;
      display: flex;
      gap: 10px;
      align-items: center;
      text-align: left;
      cursor: pointer;
    }
    .role-option.active { border-color: #9fc0fa; background: #f8fbff; }
    .role-option.locked { opacity: .55; cursor: not-allowed; }
    .chat-body {
      min-height: 430px;
      padding: 18px;
      background: linear-gradient(#fbfdff, #fff);
      display: grid;
      gap: 12px;
      align-content: start;
    }
    .bubble {
      max-width: 72%;
      padding: 11px 13px;
      border-radius: 10px;
      line-height: 1.6;
      border: 1px solid var(--line);
      background: #fff;
    }
    .bubble.user {
      justify-self: end;
      color: #fff;
      background: var(--primary);
      border-color: var(--primary);
    }
    .chat-input {
      padding: 12px;
      display: flex;
      gap: 8px;
      border-top: 1px solid var(--line);
      background: var(--panel);
    }
    .chat-input input {
      flex: 1;
      height: 38px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      padding: 0 12px;
    }
    .modal-mask {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, .32);
      z-index: 20;
      padding: 24px;
    }
    .modal-mask.open { display: flex; }
    .modal {
      width: min(680px, 100%);
      background: #fff;
      border-radius: 10px;
      border: 1px solid var(--line);
      box-shadow: 0 24px 70px rgba(15, 23, 42, .22);
      overflow: hidden;
    }
    .modal-head,
    .modal-foot {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .modal-foot { border-top: 1px solid var(--line); border-bottom: 0; justify-content: flex-end; }
    .modal-body { padding: 18px; }
    .form-grid {
      display: grid;
      gap: 14px;
    }
    .form-control {
      display: grid;
      gap: 6px;
    }
    .form-control input,
    .form-control textarea {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      padding: 10px 12px;
      resize: vertical;
    }

    @media (max-width: 1100px) {
      .workspace { grid-template-columns: 1fr; }
      .panel { position: static; }
      .search { width: 220px; }
    }
    @media (max-width: 760px) {
      .app, .app.collapsed { grid-template-columns: 72px minmax(0, 1fr); }
      .side-nav { padding-left: 8px; padding-right: 8px; }
      .nav-text, .brand-text, .nav-section { display: none; }
      .brand { justify-content: center; padding-left: 0; padding-right: 0; }
      .nav-item { justify-content: center; padding: 0; }
      .main { padding: 12px; }
      .topbar { align-items: stretch; flex-direction: column; }
      .actions { justify-content: stretch; }
      .search { width: 100%; }
      .cards { grid-template-columns: 1fr; }
      .meta { grid-template-columns: 1fr; }
      .meta-item { border-right: 0; border-bottom: 1px solid var(--line); }
      .meta-item:last-child { border-bottom: 0; }
      .card-actions { grid-template-columns: repeat(2, 1fr); }
      .tabs { grid-template-columns: repeat(2, 1fr); }
      .chat-page { grid-template-columns: 1fr; }
      .stamp-page { grid-template-columns: 1fr; }
      .cute-map { min-height: 680px; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <aside class="side-nav">
      <div class="brand">
        <div class="logo">智</div>
        <div class="brand-text">
          <div class="brand-title">小智自研平台</div>
          <div class="brand-subtitle">配置源与演示后台</div>
        </div>
      </div>
      <div id="navItems"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="title-wrap">
          <button class="collapse-btn" id="collapseBtn">☰</button>
          <div class="app-icon">智</div>
          <div>
            <h1 id="pageTitle">智能体工作台</h1>
            <div class="subtitle" id="pageSubtitle">共 3 个智能体 · 自研平台为配置源 · 官网半自动同步</div>
          </div>
        </div>
        <div class="actions">
          <div class="mode-switch">
            <button class="mode-btn active" data-mode="user">用户端</button>
            <button class="mode-btn" data-mode="admin">管理员端</button>
          </div>
          <input class="search" id="searchInput" placeholder="搜索智能体、设备或同步状态" />
          <button class="btn" id="filterBtn">筛选</button>
          <button class="btn primary" id="primaryAction">添加智能体</button>
          <button class="btn primary" id="secondaryAction">添加设备</button>
        </div>
      </header>

      <section id="content"></section>
    </main>
  </div>
  <div class="modal-mask" id="configModal">
    <div class="modal">
      <div class="modal-head">
        <div>
          <div class="panel-title" id="modalTitle">配置智能体</div>
          <div class="subtitle">管理端弹窗配置，用户侧不可见、不可编辑</div>
        </div>
        <button class="btn" id="closeModal">关闭</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <label class="form-control">
            <span class="field-title">角色名称</span>
            <input id="modalName" value="" />
          </label>
          <label class="form-control">
            <span class="field-title">人格 Prompt</span>
            <textarea id="modalPrompt" rows="5"></textarea>
          </label>
          <label class="form-control">
            <span class="field-title">音色 / 知识库</span>
            <input id="modalDataset" value="" />
          </label>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" id="cancelModal">取消</button>
        <button class="btn primary">保存并标记待同步</button>
      </div>
    </div>
  </div>

  <script>
    const agents = [
      {
        id: "alo",
        initial: "洛",
        avatar: "rose",
        name: "阿洛 · 景区讲解",
        summary: "绑定设备 MB202607260001",
        status: "在线",
        statusType: "online",
        sync: "待同步",
        syncType: "warn",
        role: "活泼好奇",
        model: "小智 Lite · voice_alo",
        recent: "3 分钟前",
        prompt: "你是活泼、好奇、喜欢讲故事的三坊七巷旅游伙伴。回答要口语化，有角色感，并优先引用当前点位知识。",
        dataset: "三坊七巷多模态数据集 · 128 个 chunk",
        device: "MB202607260001 · 在线 · 已绑定",
        syncSnapshot: "Prompt、voice_id、工具地址、知识库引用摘要已生成，等待人工确认同步到小智官网。",
        unlocked: true,
        conversations: [
          ["游客", "这里为什么叫三坊七巷？", "3 分钟前"],
          ["阿洛", "因为这里由三坊和七巷组成，是福州古城格局保存最完整的区域之一。", "3 分钟前"]
        ]
      },
      {
        id: "yoyo",
        initial: "悠",
        avatar: "green",
        name: "悠悠 · 闽都文化",
        summary: "绑定设备 MB202607260002",
        status: "在线",
        statusType: "online",
        sync: "已同步",
        syncType: "sync",
        role: "温暖沉稳",
        model: "小智 Lite · voice_yoyo",
        recent: "无",
        prompt: "你是温暖、沉稳、注重文化脉络的闽都文化讲解员。回答要清晰、有层次，适合评审现场演示。",
        dataset: "三坊七巷多模态数据集 · 128 个 chunk",
        device: "MB202607260002 · 在线 · 已绑定",
        syncSnapshot: "官网配置已确认，同步人：演示管理员，最后同步：今天 10:24。",
        unlocked: true,
        conversations: [
          ["系统", "暂无真实设备对话，等待现场演示。", "刚刚"]
        ]
      },
      {
        id: "taiwan",
        initial: "台",
        avatar: "blue",
        name: "台湾女友 · 盲盒款",
        summary: "市场化预留角色",
        status: "未绑定",
        statusType: "warn",
        sync: "草稿",
        syncType: "warn",
        role: "嘴硬护短",
        model: "待配置",
        recent: "无",
        prompt: "市场化预留角色。用于 AI 盲盒多性格方向，不进入课题一期验收。",
        dataset: "未关联景区数据集",
        device: "未绑定实体机器人",
        syncSnapshot: "草稿状态，不需要同步官网。",
        unlocked: false,
        conversations: [
          ["系统", "市场化角色暂不进入课题一期演示链路。", "刚刚"]
        ]
      }
    ];

    const pages = {
      agents: {
        title: "智能体管理",
        subtitle: "管理员端：配置角色、绑定设备、生成官网同步快照"
      },
      conversations: {
        title: "对话",
        subtitle: "用户端：盲盒绑定后只有一个专属智能体，不能自行选择或配置",
        cards: [
          ["最近对话", "12 条", "支持按角色、设备、来源筛选"],
          ["知识命中", "9 条", "展示命中的景区知识片段摘要"],
          ["模拟数据", "2 条", "必须与真实设备记录明确区分"]
        ]
      },
      sync: {
        title: "官网同步",
        subtitle: "管理员端：我方平台生成配置快照，再人工或半自动同步到小智官网",
        cards: [
          ["待同步角色", "1 个", "阿洛 · 景区讲解"],
          ["已同步角色", "1 个", "悠悠 · 闽都文化"],
          ["同步快照", "可复制", "Prompt、voice_id、工具地址、知识库引用摘要"]
        ]
      },
      stamp: {
        title: "景区打卡",
        subtitle: "可爱的景区地图，展示已解锁角色陪伴下的点位打卡",
      },
      album: {
        title: "我的图鉴",
        subtitle: "用户收集已完成打卡印章和角色互动回忆",
        cards: [
          ["严复故居", "已获得", "阿洛讲了严复与近代启蒙的故事"],
          ["郎官巷", "待收集", "到达点位后可解锁"],
          ["水榭戏台", "待收集", "完成 NFC 打卡后点亮"]
        ]
      },
      devices: {
        title: "设备绑定",
        subtitle: "管理员端：每台硬件机器人只能绑定一个智能体，后期由原厂后台更换",
        cards: [
          ["MB202607260001", "已绑定", "阿洛 · 景区讲解"],
          ["MB202607260002", "已绑定", "悠悠 · 闽都文化"],
          ["绑定规则", "单设备单智能体", "用户端不能自由切换角色"]
        ]
      }
    };

    const userNav = [
      ["conversations", "●", "我的伙伴"],
      ["stamp", "✓", "景区打卡"],
      ["album", "▣", "我的图鉴"]
    ];
    const adminNav = [
      ["agents", "●", "智能体管理"],
      ["devices", "▤", "设备绑定"],
      ["sync", "↗", "官网同步"]
    ];

    const state = { mode: "user", page: "conversations", agentId: "alo", tab: "config", keyword: "", spotId: "yanfu" };

    const app = document.querySelector("#app");
    const content = document.querySelector("#content");
    const pageTitle = document.querySelector("#pageTitle");
    const pageSubtitle = document.querySelector("#pageSubtitle");
    const searchInput = document.querySelector("#searchInput");
    const navItems = document.querySelector("#navItems");

    document.querySelector("#collapseBtn").addEventListener("click", () => {
      app.classList.toggle("collapsed");
    });

    document.querySelectorAll(".mode-btn").forEach((button) => {
      button.addEventListener("click", () => {
        state.mode = button.dataset.mode;
        state.page = state.mode === "user" ? "conversations" : "agents";
        state.agentId = "alo";
        render();
      });
    });

    searchInput.addEventListener("input", (event) => {
      state.keyword = event.target.value.trim();
      render();
    });

    document.querySelector("#filterBtn").addEventListener("click", () => {
      state.keyword = "待同步";
      searchInput.value = "待同步";
      render();
    });

    document.querySelector("#primaryAction").addEventListener("click", () => {
      if (state.mode === "user") {
        state.page = "stamp";
        render();
        return;
      }
      state.page = "agents";
      state.agentId = "taiwan";
      state.tab = "config";
      render();
    });

    document.querySelector("#secondaryAction").addEventListener("click", () => {
      if (state.mode === "user") {
        state.page = "album";
        render();
        return;
      }
      state.page = "devices";
      render();
    });
    document.querySelector("#closeModal").addEventListener("click", closeConfigModal);
    document.querySelector("#cancelModal").addEventListener("click", closeConfigModal);
    document.querySelector("#configModal").addEventListener("click", (event) => {
      if (event.target.id === "configModal") closeConfigModal();
    });

    function currentAgent() {
      return agents.find((agent) => agent.id === state.agentId) || agents[0];
    }

    function matchesKeyword(agent) {
      if (!state.keyword) return true;
      return [agent.name, agent.summary, agent.status, agent.sync, agent.role, agent.model, agent.device]
        .join(" ")
        .includes(state.keyword);
    }

    function render() {
      renderNav();
      renderMode();
      const pageMeta = pages[state.page];
      pageTitle.textContent = pageMeta.title;
      pageSubtitle.textContent = pageMeta.subtitle;
      document.querySelectorAll(".nav-item").forEach((item) => {
        item.classList.toggle("active", item.dataset.page === state.page);
      });
      content.innerHTML = state.page === "agents"
        ? renderAgentsPage()
        : state.page === "conversations"
          ? renderChatPage()
          : state.page === "stamp"
            ? renderStampPage()
            : renderModulePage(pageMeta);
      bindDynamicEvents();
    }

    function renderNav() {
      const nav = state.mode === "user" ? userNav : adminNav;
      const section = state.mode === "user" ? "用户游玩" : "管理后台";
      navItems.innerHTML = `
        <div class="nav-section">${section}</div>
        ${nav.map(([page, icon, label]) => `
          <button class="nav-item ${state.page === page ? "active" : ""}" data-page="${page}">
            <span class="nav-ico">${icon}</span><span class="nav-text">${label}</span>
          </button>
        `).join("")}
      `;
      navItems.querySelectorAll(".nav-item").forEach((item) => {
        item.addEventListener("click", () => {
          state.page = item.dataset.page;
          state.tab = "config";
          render();
        });
      });
    }

    function renderMode() {
      document.querySelectorAll(".mode-btn").forEach((button) => {
        button.classList.toggle("active", button.dataset.mode === state.mode);
      });
      document.querySelector(".brand-title").textContent = state.mode === "user" ? "盲盒伙伴" : "小智自研平台";
      document.querySelector(".brand-subtitle").textContent = state.mode === "user" ? "专属智能体与景区打卡" : "配置源与演示后台";
      document.querySelector("#primaryAction").textContent = state.mode === "user" ? "开始打卡" : "添加智能体";
      document.querySelector("#secondaryAction").textContent = state.mode === "user" ? "查看图鉴" : "添加设备";
      searchInput.placeholder = state.mode === "user" ? "搜索我的对话或打卡回忆" : "搜索智能体、设备或同步状态";
    }

    function renderAgentsPage() {
      const visibleAgents = agents.filter(matchesKeyword);
      return `
        <section>
            <div class="cards">
              ${visibleAgents.map(renderAgentCard).join("") || `<div class="module-page">没有匹配的智能体。</div>`}
            </div>
            <div class="footer-note">
              产品口径：这里是管理员端智能体管理。配置按钮打开弹窗，不在右侧局部切换；用户端不会看到配置入口，也不能自行选择或切换智能体。
            </div>
        </section>
      `;
    }

    function renderAgentCard(agent) {
      return `
        <article class="agent-card ${agent.id === state.agentId ? "active" : ""}" data-agent="${agent.id}">
          <div class="card-head">
            <div class="avatar ${agent.avatar}">${agent.initial}</div>
            <div class="agent-title">
              <div class="name-row">
                <span class="name">${agent.name}</span>
                <span class="status ${agent.statusType}">${agent.status}</span>
                <span class="status ${agent.syncType}">${agent.sync}</span>
              </div>
              <div class="subtitle">${agent.summary}</div>
            </div>
            <div class="more">...</div>
          </div>
          <div class="meta">
            <div class="meta-item"><span class="label">角色</span><div class="value">${agent.role}</div></div>
            <div class="meta-item"><span class="label">模型 / 音色</span><div class="value">${agent.model}</div></div>
            <div class="meta-item"><span class="label">最近对话</span><div class="value">${agent.recent}</div></div>
          </div>
          <div class="card-actions">
            <button class="btn open-config" data-agent="${agent.id}">配置</button>
            <button class="btn card-route" data-agent="${agent.id}" data-page="conversations">对话</button>
            <button class="btn card-route" data-agent="${agent.id}" data-page="stamp">打卡</button>
            <button class="btn card-route" data-agent="${agent.id}" data-page="sync">同步</button>
          </div>
        </article>
      `;
    }

    function renderChatPage() {
      const active = agents.find((agent) => agent.id === "alo");
      state.agentId = active.id;
      return `
        <section class="chat-page">
          <aside class="role-rail">
            <div class="rail-head">
              <div class="panel-title">我的盲盒伙伴</div>
              <div class="subtitle">一期用户不能自己选择智能体，只能使用硬件已绑定的专属角色。</div>
            </div>
            ${agents.map((agent) => `
              <button class="role-option ${agent.id === active.id ? "active" : "locked"}" data-agent="${agent.id}" ${agent.id === active.id ? "" : "disabled"}>
                <div class="avatar ${agent.avatar}">${agent.initial}</div>
                <div>
                  <div class="value">${agent.name}</div>
                  <div class="subtitle">${agent.id === active.id ? "当前硬件绑定角色，可对话" : "其他角色仅展示，不可选择"}</div>
                </div>
              </button>
            `).join("")}
          </aside>
          <section class="chat-shell">
            <div class="chat-head">
              <div class="panel-title">${active.name}</div>
              <div class="subtitle">用户侧单页对话体验 · 不出现配置、同步、设备绑定、角色切换等管理操作</div>
            </div>
            <div class="chat-body">
              ${active.conversations.map((row) => `
                <div class="bubble ${row[0] === "游客" ? "user" : ""}">${row[0]}：${row[1]}</div>
              `).join("")}
              <div class="event">
                <div class="event-top"><span>系统提示</span><span>演示状态</span></div>
                <div class="event-text">这台实体机器人出厂绑定阿洛。若硬件进入 GPS 范围并完成 NFC 打卡，本页只呈现角色互动结果，不暴露后台配置项。</div>
              </div>
            </div>
            <div class="chat-input">
              <input placeholder="和已解锁角色对话..." />
              <button class="btn primary">发送</button>
            </div>
          </section>
        </section>
      `;
    }

    function renderAgentPanel(agent) {
      const tabLabel = { config: "配置", dialog: "对话", device: "设备", sync: "同步" };
      return `
        <aside class="panel">
          <div class="panel-head">
            <div>
              <div class="panel-title">${agent.name}</div>
              <div class="panel-copy">${agent.device}。当前查看：${tabLabel[state.tab]}。</div>
            </div>
            <span class="status ${agent.syncType}">${agent.sync}</span>
          </div>
          <div class="tabs">
            ${["config", "dialog", "device", "sync"].map((tab) => `
              <button class="tab ${state.tab === tab ? "active" : ""}" data-tab="${tab}">${tabLabel[tab]}</button>
            `).join("")}
          </div>
          <div class="panel-body">${renderPanelBody(agent)}</div>
        </aside>
      `;
    }

    function renderPanelBody(agent) {
      if (state.tab === "dialog") {
        return `
          <div class="field">
            <div class="field-title">最近对话</div>
            <div class="timeline">
              ${agent.conversations.map((row) => `
                <div class="event">
                  <div class="event-top"><span>${row[0]}</span><span>${row[2]}</span></div>
                  <div class="event-text">${row[1]}</div>
                </div>
              `).join("")}
            </div>
          </div>
          <div class="field">
            <div class="field-title">知识来源</div>
            <div class="field-main">spot_yanfu_001 · 街巷格局 / 历史沿革 / 入门版讲解片段</div>
          </div>
        `;
      }
      if (state.tab === "device") {
        return `
          <div class="field"><div class="field-title">绑定设备</div><div class="field-main">${agent.device}</div></div>
          <div class="field"><div class="field-title">绑定规则</div><div class="field-main">每台硬件机器人只能绑定一个智能体。后期只能由原厂后台更换。</div></div>
          <div class="field"><div class="field-title">最近定位</div><div class="field-main">GPS 已进入严复故居范围，等待 NFC 精准确认。</div></div>
        `;
      }
      if (state.tab === "sync") {
        return `
          <div class="field"><div class="field-title">官网同步状态</div><div class="field-main">${agent.sync}</div></div>
          <div class="field"><div class="field-title">同步快照</div><div class="prompt-box">${agent.syncSnapshot}</div></div>
          <div class="field"><div class="field-title">一期处理方式</div><div class="field-main">接受半自动同步：自研平台生成配置内容和操作留痕，不强制自动调用小智官网 API。</div></div>
        `;
      }
      return `
        <div class="field"><div class="field-title">人格 Prompt</div><div class="prompt-box">${agent.prompt}</div></div>
        <div class="field"><div class="field-title">音色与知识库</div><div class="field-main">${agent.model} · ${agent.dataset}</div></div>
        <div class="field"><div class="field-title">演示目标</div><div class="field-main">角色配置在自研平台维护，再通过官网同步状态体现与小智官网的阶段性对接。</div></div>
      `;
    }

    function renderModulePage(pageMeta) {
      return `
        <section class="module-page">
          <h2 class="module-title">${pageMeta.title}</h2>
          <div class="module-desc">${pageMeta.subtitle}</div>
          <div class="module-grid">
            ${pageMeta.cards.map((card) => `
              <div class="module-card">
                <div class="label">${card[0]}</div>
                <div class="value">${card[1]}</div>
                <div class="module-desc">${card[2]}</div>
              </div>
            `).join("")}
          </div>
          <div class="footer-note">这是交互原型中的轻量模块页，用来确认后台信息架构和页面跳转关系。正式开发时按产品交互规格拆分字段、接口和权限。</div>
        </section>
      `;
    }

    function renderStampPage() {
      const spots = [
        { id: "yanfu", name: "严复故居", icon: "严", x: 55, y: 38, done: true, near: true, state: "已打卡 · NFC 已确认", color: "green", reward: "启蒙之章", story: "阿洛已经为你解锁严复与近代启蒙的小故事。硬件定位显示你已到达，NFC 打卡成功。" },
        { id: "langguan", name: "郎官巷", icon: "巷", x: 28, y: 58, done: false, near: true, state: "GPS 已接近 · 等待 NFC", color: "rose", reward: "街巷之章", story: "你已经靠近郎官巷，机器人可以提示你寻找 NFC 点位。完成后会触发角色讲解。" },
        { id: "shuixie", name: "水榭戏台", icon: "戏", x: 68, y: 64, done: false, near: false, state: "待靠近 · 隐藏故事", color: "blue", reward: "戏台之章", story: "还没有进入 GPS 范围。地图先显示目标位置，到达附近后再提示 NFC 精准打卡。" },
        { id: "minsu", name: "非遗小铺", icon: "艺", x: 42, y: 76, done: false, near: false, state: "待发现 · 角色互动", color: "blue", reward: "非遗之章", story: "这是一个轻量探索点。后续可结合角色语音和景区知识片段做彩蛋。" }
      ];
      const selected = spots.find((spot) => spot.id === state.spotId) || spots[0];
      return `
        <section class="stamp-page">
          <div class="cute-map">
            <div class="map-river"></div>
            <div class="map-cloud cloud-a"></div>
            <div class="map-cloud cloud-b"></div>
            <div class="mini-house" style="left:18%;top:36%"></div>
            <div class="mini-house" style="right:22%;top:46%"></div>
            <div class="mini-house" style="left:34%;bottom:17%"></div>
            <div class="scan-line"></div>
            <div class="map-title">
              <h2>三坊七巷打卡地图</h2>
              <div class="subtitle">硬件定位联动 · 靠近点位后用 NFC 点亮印章</div>
            </div>
            <div class="map-tools">
              <div class="map-chip">GPS 已连接</div>
              <div class="map-chip">NFC 待确认</div>
            </div>
            <div class="lane"></div>
            <div class="player-marker" title="硬件当前位置"></div>
            ${spots.map((spot) => `
              <button class="stamp-pin ${spot.done ? "done" : ""} ${spot.id === selected.id ? "active" : ""}" data-spot="${spot.id}" style="left:${spot.x}%;top:${spot.y}%">
                <div class="pin-badge ${spot.color}">${spot.icon}</div>
                <div class="pin-name">${spot.name}</div>
                <div class="pin-state">${spot.state}</div>
              </button>
            `).join("")}
            <div class="spot-card">
              <div class="spot-card-head">
                <div class="spot-icon ${selected.color}">${selected.icon}</div>
                <div>
                  <div class="panel-title">${selected.name}</div>
                  <div class="subtitle">${selected.done ? "印章已点亮" : selected.near ? "已进入 GPS 范围" : "还未靠近点位"}</div>
                </div>
              </div>
              <div class="field-main">${selected.story}</div>
              <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;">
                <button class="btn primary">${selected.done ? "回看角色讲解" : selected.near ? "模拟 NFC 打卡" : "设为目标点"}</button>
                <button class="btn">让阿洛提示我</button>
              </div>
            </div>
          </div>
          <aside class="stamp-side">
            <div class="rail-head">
              <div class="panel-title">探索进度</div>
              <div class="subtitle">像小游戏一样收集景区印章，但真实触发来自硬件定位。</div>
            </div>
            <div class="stamp-album">
              ${spots.map((spot) => `<div class="stamp ${spot.done ? "done" : ""}">${spot.name}<br />${spot.done ? "已点亮" : spot.reward}</div>`).join("")}
              <div class="stamp">隐藏印章<br />待发现</div>
              <div class="stamp done">今日奖励<br />1/4</div>
            </div>
            <div class="quest-list">
              <div class="quest"><strong>当前任务</strong><span class="subtitle">前往郎官巷附近，等待 GPS 进入范围后完成 NFC 打卡。</span></div>
              <div class="quest"><strong>角色陪伴</strong><span class="subtitle">阿洛会根据点位状态播报提示，不让用户看到后台配置。</span></div>
              <div class="quest"><strong>硬件联动</strong><span class="subtitle">GPS 负责接近提醒，NFC 负责精准确认和点亮印章。</span></div>
            </div>
            <div class="footer-note" style="margin: 0 16px 16px;">
              用户看到的是游戏化地图和收集进度；点位、NFC、数据集、设备状态都藏在体验背后，由系统自动联动。
            </div>
          </aside>
        </section>
      `;
    }

    function bindDynamicEvents() {
      document.querySelectorAll(".agent-card").forEach((card) => {
        card.addEventListener("click", () => {
          state.agentId = card.dataset.agent;
          render();
        });
      });
      document.querySelectorAll(".open-config").forEach((button) => {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          state.agentId = button.dataset.agent;
          openConfigModal(currentAgent());
        });
      });
      document.querySelectorAll(".card-route").forEach((button) => {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          state.agentId = button.dataset.agent;
          state.page = button.dataset.page;
          render();
        });
      });
      document.querySelectorAll(".role-option:not(.locked)").forEach((button) => {
        button.addEventListener("click", () => {
          state.agentId = button.dataset.agent;
          render();
        });
      });
      document.querySelectorAll(".stamp-pin").forEach((button) => {
        button.addEventListener("click", () => {
          state.spotId = button.dataset.spot;
          render();
        });
      });
      document.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          state.tab = tab.dataset.tab;
          render();
        });
      });
    }

    function openConfigModal(agent) {
      document.querySelector("#modalTitle").textContent = `配置智能体：${agent.name}`;
      document.querySelector("#modalName").value = agent.name;
      document.querySelector("#modalPrompt").value = agent.prompt;
      document.querySelector("#modalDataset").value = `${agent.model} · ${agent.dataset}`;
      document.querySelector("#configModal").classList.add("open");
    }

    function closeConfigModal() {
      document.querySelector("#configModal").classList.remove("open");
    }

    render();
  </script>
</body>
</html>
